<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#07060d">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>パチンコ収支帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
/* ホール風ネオン：黒い夜の店内に金・ピンク・シアンの電飾。プラスは赤ネオン、マイナスは青ネオン */
:root{
  --bg:#07060d; --surface:#110f1c; --surface2:#181528; --ink:#f4f1ff; --muted:#9d97b8; --line:#2a2545;
  --gold:#ffcf3f; --pink:#ff2e88; --cyan:#22e4ff; --plus:#ff3b5c; --minus:#36b6ff; --chip:#1d1932;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --num:"Roboto Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:
  radial-gradient(120% 60% at 50% -10%,rgba(255,46,136,.22),transparent 60%),
  radial-gradient(80% 50% at 110% 30%,rgba(34,228,255,.12),transparent 60%),
  radial-gradient(80% 50% at -10% 70%,rgba(255,207,63,.10),transparent 60%),var(--bg);
  background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:18px 12px 16px;
  border:2px solid var(--pink);border-radius:18px;background:rgba(17,15,28,.7);position:relative;
  box-shadow:0 0 12px rgba(255,46,136,.6),inset 0 0 18px rgba(255,46,136,.25)}
header::before,header::after{content:"";position:absolute;left:14px;right:14px;height:6px;
  background:radial-gradient(circle,var(--gold) 0 2px,transparent 2.5px) 0 0/14px 6px repeat-x;filter:drop-shadow(0 0 3px var(--gold))}
header::before{top:6px} header::after{bottom:6px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,8vw,2.6rem);margin:6px 0 0;letter-spacing:.06em;line-height:1.15;
  color:#fff;text-shadow:0 0 4px #fff,0 0 10px var(--gold),0 0 22px var(--gold),0 0 40px #ff8a00}
h1 small{display:block;font-family:var(--num);font-size:.72rem;letter-spacing:.4em;font-weight:700;color:var(--cyan);margin-bottom:6px;
  text-shadow:0 0 6px var(--cyan),0 0 14px var(--cyan)}
@media (prefers-reduced-motion:no-preference){
  h1{animation:flicker 6s infinite}
  @keyframes flicker{0%,92%,100%{opacity:1}93%{opacity:.55}94%{opacity:1}96%{opacity:.7}97%{opacity:1}}
  header::before,header::after{animation:chase 1.2s steps(2) infinite}
  @keyframes chase{to{background-position:14px 0}}
}
h2{font-family:var(--display);font-weight:400;font-size:.95rem;letter-spacing:.18em;color:var(--cyan);margin:0 0 10px;
  text-shadow:0 0 6px rgba(34,228,255,.8)}
h2::before{content:"◆ ";color:var(--pink);text-shadow:0 0 6px var(--pink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--muted);font:inherit;font-size:.85rem;font-weight:700;padding:6px 16px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pink);color:#fff;border-color:var(--pink);box-shadow:0 0 10px var(--pink),0 0 22px rgba(255,46,136,.5)}
.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.plus{color:var(--plus);text-shadow:0 0 8px rgba(255,59,92,.7)} .minus{color:var(--minus);text-shadow:0 0 8px rgba(54,182,255,.7)} .zero{color:var(--muted)}
.hero{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid rgba(255,207,63,.5);border-radius:18px;padding:22px 20px;
  display:flex;flex-direction:column;gap:16px;box-shadow:0 0 14px rgba(255,207,63,.25),inset 0 0 30px rgba(255,207,63,.06)}
.hero h2{color:var(--gold);text-shadow:0 0 6px rgba(255,207,63,.8)}
.big{font-family:var(--display);font-size:clamp(2.6rem,12vw,3.8rem);line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.big.plus{text-shadow:0 0 6px #fff3,0 0 14px var(--plus),0 0 32px var(--plus)}
.big.minus{text-shadow:0 0 14px var(--minus),0 0 32px var(--minus)}
.big .yen{font-size:.4em;margin-left:6px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:#0b0a14;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi span{display:block;font-size:.7rem;color:var(--muted);letter-spacing:.1em;font-weight:700}
.kpi b{font-family:var(--num);font-size:1.02rem;font-variant-numeric:tabular-nums;color:var(--gold);text-shadow:0 0 6px rgba(255,207,63,.5)}
.kpi b.plus{color:var(--plus)} .kpi b.minus{color:var(--minus)}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,1fr)}}
.sample-note{font-size:.8rem;background:rgba(34,228,255,.08);border:1px dashed rgba(34,228,255,.5);border-radius:10px;padding:8px 12px;color:var(--cyan)}
.chart{width:100%;height:auto;display:block;background:#0b0a14;border:1px solid var(--line);border-radius:12px}
.chart text{fill:var(--muted);font-family:var(--num);font-size:10px}
.chart polyline{filter:drop-shadow(0 0 4px currentColor)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
  cursor:pointer;background:var(--surface);font:inherit;color:inherit;text-align:left;width:100%}
.row:hover,.row:active{border-color:var(--pink);box-shadow:0 0 10px rgba(255,46,136,.4)}
.d{font-family:var(--num);font-size:.78rem;color:var(--muted);line-height:1.3;text-align:center;border-right:1px solid var(--line);padding-right:8px}
.d b{display:block;font-size:1.05rem;color:var(--gold)}
.m{min-width:0}
.m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m span{font-size:.76rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-family:var(--num);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums;text-align:right}
.amt small{display:block;font-weight:500;font-size:.7rem;color:var(--muted);text-shadow:none}
.empty{color:var(--muted);padding:16px 4px;text-align:center}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 12px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left}
th{font-size:.7rem;color:var(--pink);font-weight:700;letter-spacing:.1em}
td{font-variant-numeric:tabular-nums}
.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:10;
  background:linear-gradient(180deg,#ffe27a,var(--gold) 60%,#e0a800);color:#2a1800;border:0;font-family:var(--display);font-size:1.05rem;letter-spacing:.06em;
  padding:15px 24px;border-radius:999px;cursor:pointer;box-shadow:0 0 0 2px #fff6,0 0 16px var(--gold),0 0 36px rgba(255,207,63,.6)}
@media (prefers-reduced-motion:no-preference){.fab{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 2px #fff8,0 0 24px var(--gold),0 0 50px rgba(255,207,63,.8)}}}
.sheet-bg{position:fixed;inset:0;background:rgba(3,2,8,.75);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;border-top:2px solid var(--pink);
  box-shadow:0 -4px 24px rgba(255,46,136,.45);
  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(20px,env(safe-area-inset-left,0px))}
.sheet h3{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0 0 14px;color:var(--gold);text-shadow:0 0 8px rgba(255,207,63,.7)}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.76rem;color:var(--muted);font-weight:700;min-width:0}
label.full{grid-column:1/-1}
input,select{font:inherit;font-size:16px;color:var(--ink);background:#0b0a14;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 8px rgba(34,228,255,.5);outline:none}
.preview{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;background:#0b0a14;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.preview b{font-family:var(--display);font-weight:400;font-size:1.6rem}
.actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 18px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--pink);color:#fff;border-color:var(--pink);box-shadow:0 0 12px rgba(255,46,136,.6)}
.btn.danger{color:var(--plus);margin-right:auto}
.status{font-size:.76rem;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);background:#0b0a14;color:var(--gold);border:1px solid var(--gold);
  box-shadow:0 0 12px rgba(255,207,63,.5);padding:8px 16px;border-radius:999px;font-size:.85rem;z-index:30;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1><small>PACHINKO LEDGER</small>パチンコ収支帳</h1>
    <div class="chips" id="periods" role="group" aria-label="期間">
      <button class="chip" data-p="month" aria-pressed="true">今月</button>
      <button class="chip" data-p="last">先月</button>
      <button class="chip" data-p="year">今年</button>
      <button class="chip" data-p="all">全期間</button>
    </div>
  </header>

  <div id="sampleNote" class="sample-note" hidden>表示中はサンプルデータです。右下の「＋ 記録する」で最初の1件を入れると、あなたの記録に切り替わります。</div>

  <section class="hero" aria-label="収支サマリー">
    <div>
      <h2 id="periodLabel">今月の収支</h2>
      <div class="big" id="total">±0<span class="yen">円</span></div>
    </div>
    <div class="kpis">
      <div class="kpi"><span>稼働</span><b id="kDays">0日</b></div>
      <div class="kpi"><span>勝率</span><b id="kWin">—</b></div>
      <div class="kpi"><span>総投資</span><b id="kIn">0</b></div>
      <div class="kpi"><span>日平均</span><b id="kAvg">—</b></div>
    </div>
    <svg class="chart" id="chart" viewBox="0 0 640 180" role="img" aria-label="累計収支の推移"></svg>
  </section>

  <section>
    <h2>記録</h2>
    <div class="list" id="list"></div>
  </section>

  <section>
    <h2>機種別</h2>
    <div class="tbl"><table><thead><tr><th>機種</th><th>回数</th><th>勝</th><th>収支</th></tr></thead><tbody id="byMachine"></tbody></table></div>
  </section>

  <section>
    <h2>月別</h2>
    <div class="tbl"><table><thead><tr><th>月</th><th>稼働</th><th>投資</th><th>回収</th><th>収支</th></tr></thead><tbody id="byMonth"></tbody></table></div>
  </section>

  <section>
    <h2>バックアップ</h2>
    <div class="actions" style="justify-content:flex-start">
      <button type="button" class="btn" id="expBtn">バックアップを保存</button>
      <label class="btn" style="flex-direction:row;font-size:inherit;color:var(--ink)">読み込む<input type="file" id="impFile" accept=".json,application/json" hidden></label>
    </div>
  </section>
  <p class="status" id="status">読み込み中…</p>
</div>

<button class="fab" id="addBtn">＋ 記録する</button>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">記録する</h3>
    <form id="form">
      <label>日付<input type="date" id="fDate" required></label>
      <label>種別
        <select id="fRate">
          <option>4円パチ</option><option>1円パチ</option><option>0.5円パチ</option>
          <option>20円スロ</option><option>5円スロ</option><option>その他</option>
        </select>
      </label>
      <label class="full">店舗<input id="fStore" list="storeList" placeholder="例：マルハン新宿東宝ビル" autocomplete="off"></label>
      <label class="full">機種<input id="fMachine" list="machineList" placeholder="例：e花の慶次" autocomplete="off" required></label>
      <label>投資（円）<input type="number" id="fIn" inputmode="numeric" min="0" step="500" placeholder="0" required></label>
      <label>回収（円）<input type="number" id="fOut" inputmode="numeric" min="0" step="100" placeholder="0" required></label>
      <label class="full">メモ<input id="fMemo" placeholder="例：大当たり8回、RUSH 3回" autocomplete="off"></label>
      <div class="preview"><span>収支</span><b id="fBal" class="zero">±0円</b></div>
      <div class="actions">
        <button type="button" class="btn danger" id="delBtn" hidden>削除</button>
        <button type="button" class="btn" id="cancelBtn">閉じる</button>
        <button type="submit" class="btn primary" id="saveBtn">保存</button>
      </div>
    </form>
    <datalist id="storeList"></datalist><datalist id="machineList"></datalist>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = id => document.getElementById(id);
const SAMPLE = (() => {
  const t = new Date(); const y = t.getFullYear(), m = t.getMonth();
  const d = (mo, day) => { const x = new Date(y, m + mo, day); return x.toISOString().slice(0,10); };
  return [
    {id:"s1",date:d(0,Math.min(3,t.getDate())),store:"サンプル店A",machine:"e花の慶次",rate:"4円パチ",in:18000,out:42300,memo:"サンプル"},
    {id:"s2",date:d(0,Math.min(5,t.getDate())),store:"サンプル店A",machine:"Pエヴァ",rate:"4円パチ",in:25000,out:0,memo:"サンプル"},
    {id:"s3",date:d(-1,12),store:"サンプル店B",machine:"スマスロ北斗",rate:"20円スロ",in:30000,out:51200,memo:"サンプル"},
    {id:"s4",date:d(-1,20),store:"サンプル店B",machine:"e花の慶次",rate:"4円パチ",in:12000,out:8600,memo:"サンプル"},
    {id:"s5",date:d(-2,8),store:"サンプル店A",machine:"Pエヴァ",rate:"1円パチ",in:5000,out:9800,memo:"サンプル"}
  ];
})();

let records = [];     // user's real records
let period = "month";
let editing = null;
let store = { save: async()=>{throw 0}, remove: async()=>{throw 0} }; // 接続完了まで
let usingSample = true;

const yen = n => (n>0?"+":n<0?"−":"±") + Math.abs(n).toLocaleString("ja-JP");
const cls = n => n>0?"plus":n<0?"minus":"zero";
const bal = r => (r.out||0) - (r.in||0);

function inPeriod(r){
  const t = new Date(); const y=t.getFullYear(), m=t.getMonth();
  const [ry, rm] = r.date.split("-").map(Number);
  if (period==="month") return ry===y && rm-1===m;
  if (period==="last"){ const l=new Date(y,m-1,1); return ry===l.getFullYear() && rm-1===l.getMonth(); }
  if (period==="year") return ry===y;
  return true;
}
const LABEL = {month:"今月の収支",last:"先月の収支",year:"今年の収支",all:"全期間の収支"};

function render(){
  const data = (usingSample ? SAMPLE : records).slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  $("sampleNote").hidden = !usingSample;
  const rows = data.filter(inPeriod);
  const total = rows.reduce((s,r)=>s+bal(r),0);
  const days = new Map(); rows.forEach(r=>days.set(r.date,(days.get(r.date)||0)+bal(r)));
  const wins = [...days.values()].filter(v=>v>0).length;
  $("periodLabel").textContent = LABEL[period];
  $("total").className = "big " + cls(total);
  $("total").innerHTML = yen(total) + '<span class="yen">円</span>';
  $("kDays").textContent = days.size + "日";
  $("kWin").textContent = days.size ? Math.round(wins/days.size*100) + "%" : "—";
  $("kIn").textContent = rows.reduce((s,r)=>s+(r.in||0),0).toLocaleString("ja-JP");
  const avg = days.size ? Math.round(total/days.size) : null;
  $("kAvg").textContent = avg===null ? "—" : yen(avg);
  $("kAvg").className = avg===null ? "" : cls(avg);
  drawChart(rows);

  const list = $("list"); list.textContent = "";
  if (!rows.length){ const p=document.createElement("p"); p.className="empty"; p.textContent="この期間の記録はまだありません。"; list.append(p); }
  rows.forEach(r=>{
    const b = document.createElement("button"); b.className="row"; b.type="button";
    const [,mm,dd] = r.date.split("-"); const wd = "日月火水木金土"[new Date(r.date+"T00:00").getDay()];
    b.innerHTML = `<div class="d"><b>${+mm}/${+dd}</b>${wd}曜</div><div class="m"><b></b><span></span></div><div class="amt ${cls(bal(r))}">${yen(bal(r))}<small>投資 ${(r.in||0).toLocaleString("ja-JP")}</small></div>`;
    b.querySelector(".m b").textContent = r.machine;
    b.querySelector(".m span").textContent = [r.rate, r.store, r.memo].filter(Boolean).join(" · ");
    b.onclick = () => openSheet(r);
    list.append(b);
  });

  const mach = new Map();
  rows.forEach(r=>{ const k=r.machine; const v=mach.get(k)||{n:0,w:0,s:0}; v.n++; if(bal(r)>0)v.w++; v.s+=bal(r); mach.set(k,v); });
  $("byMachine").innerHTML = [...mach].sort((a,b)=>b[1].s-a[1].s).map(([k,v])=>
    `<tr><td>${esc(k)}</td><td>${v.n}</td><td>${v.w}</td><td class="num ${cls(v.s)}">${yen(v.s)}</td></tr>`).join("") || `<tr><td colspan="4" class="empty">—</td></tr>`;

  const mon = new Map();
  data.forEach(r=>{ const k=r.date.slice(0,7); const v=mon.get(k)||{d:new Set(),i:0,o:0}; v.d.add(r.date); v.i+=r.in||0; v.o+=r.out||0; mon.set(k,v); });
  $("byMonth").innerHTML = [...mon].sort((a,b)=>a[0]<b[0]?1:-1).map(([k,v])=>{
    const s=v.o-v.i; const [y,m]=k.split("-");
    return `<tr><td>${y}年${+m}月</td><td>${v.d.size}日</td><td class="num">${v.i.toLocaleString("ja-JP")}</td><td class="num">${v.o.toLocaleString("ja-JP")}</td><td class="num ${cls(s)}">${yen(s)}</td></tr>`;
  }).join("") || `<tr><td colspan="5" class="empty">—</td></tr>`;

  const stores=[...new Set(records.map(r=>r.store).filter(Boolean))], machines=[...new Set(records.map(r=>r.machine).filter(Boolean))];
  $("storeList").innerHTML = stores.map(s=>`<option value="${esc(s)}">`).join("");
  $("machineList").innerHTML = machines.map(s=>`<option value="${esc(s)}">`).join("");
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function niceStep(range){ const raw=range/4; const p=Math.pow(10,Math.floor(Math.log10(raw||1))); const n=raw/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function drawChart(rows){
  const svg=$("chart"); const W=640,H=180,L=56,R=12,T=12,B=24;
  const asc = rows.slice().sort((a,b)=>a.date<b.date?-1:1);
  let c=0; const pts=[0]; asc.forEach(r=>{c+=bal(r);pts.push(c);});
  if (asc.length<1){ svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle">記録が入るとここに累計グラフが出ます</text>`; return; }
  let lo=Math.min(0,...pts), hi=Math.max(0,...pts); if(hi===lo){hi+=10000;lo-=10000;}
  const st=niceStep(hi-lo); lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st;
  const x=i=>L+(W-L-R)*(i/(pts.length-1)); const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g="";
  for(let v=lo; v<=hi+1e-6; v+=st){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v===0?1.5:1}" ${v===0?'':'stroke-dasharray="2 4"'}/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v===0?"0":(v/10000).toLocaleString("ja-JP")+"万"}</text>`; }
  const line = pts.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const end = pts[pts.length-1]; const col = end>=0?"var(--plus)":"var(--minus)";
  const area = `${x(0)},${y(0)} ${line} ${x(pts.length-1)},${y(0)}`;
  const first=asc[0].date.slice(5).replace("-","/"), last=asc[asc.length-1].date.slice(5).replace("-","/");
  g+=`<polygon points="${area}" fill="${col}" opacity=".12"/><polyline points="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>`;
  g+=`<circle cx="${x(pts.length-1)}" cy="${y(end)}" r="4.5" fill="${col}"/>`;
  g+=`<text x="${L}" y="${H-6}">${first.replace(/^0/,"")}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${last.replace(/^0/,"")}</text>`;
  svg.innerHTML=g;
}

/* ---- sheet ---- */
function openSheet(r){
  if (r && usingSample){ toast("サンプルは編集できません。新しく記録してください"); return; }
  editing = r||null;
  $("sheetTitle").textContent = r ? "記録を編集" : "記録する";
  $("fDate").value = r ? r.date : new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  $("fRate").value = r ? r.rate : (records[0]?.rate || "4円パチ");
  $("fStore").value = r ? r.store : (latest()?.store || "");
  $("fMachine").value = r ? r.machine : "";
  $("fIn").value = r ? r.in : ""; $("fOut").value = r ? r.out : ""; $("fMemo").value = r ? (r.memo||"") : "";
  $("delBtn").hidden = !r; $("delBtn").textContent="削除"; $("delBtn").dataset.arm="";
  updPreview(); $("sheetBg").hidden=false; setTimeout(()=>$(r?"fIn":"fMachine").focus(),50);
}
const latest = () => records.slice().sort((a,b)=>a.date<b.date?1:-1)[0];
function closeSheet(){ $("sheetBg").hidden=true; editing=null; }
function updPreview(){ const v=(+$("fOut").value||0)-(+$("fIn").value||0); $("fBal").textContent=yen(v)+"円"; $("fBal").className=cls(v); }
["fIn","fOut"].forEach(i=>$(i).addEventListener("input",updPreview));
$("addBtn").onclick=()=>openSheet(null);
$("cancelBtn").onclick=closeSheet;
$("sheetBg").addEventListener("click",e=>{ if(e.target===$("sheetBg")) closeSheet(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("sheetBg").hidden) closeSheet(); });

$("form").addEventListener("submit", async e=>{
  e.preventDefault();
  const rec = { id: editing?.id || ("r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
    date:$("fDate").value, rate:$("fRate").value, store:$("fStore").value.trim(), machine:$("fMachine").value.trim(),
    in:Math.max(0,+$("fIn").value||0), out:Math.max(0,+$("fOut").value||0), memo:$("fMemo").value.trim() };
  if(!rec.date||!rec.machine){ toast("日付と機種を入れてください"); return; }
  $("saveBtn").disabled=true;
  try{ await store.save(rec); upsertLocal(rec); usingSample=false; closeSheet(); toast(editing?"更新しました":"保存しました"); render(); }
  catch(err){ toast("保存できませんでした。通信を確認してもう一度お試しください"); }
  finally{ $("saveBtn").disabled=false; }
});
$("delBtn").onclick = async ()=>{
  const b=$("delBtn");
  if(!b.dataset.arm){ b.dataset.arm="1"; b.textContent="本当に削除"; return; }
  try{ await store.remove(editing.id); records=records.filter(r=>r.id!==editing.id); usingSample=!records.length; closeSheet(); toast("削除しました"); render(); }
  catch{ toast("削除できませんでした"); }
};
function upsertLocal(rec){ const i=records.findIndex(r=>r.id===rec.id); if(i>=0) records[i]=rec; else records.push(rec); }

$("periods").addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b) return;
  period=b.dataset.p; document.querySelectorAll("#periods .chip").forEach(c=>c.setAttribute("aria-pressed", c===b)); render(); });

let tt; function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2400); }

$("expBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(records,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="pachinko-"+new Date().toISOString().slice(0,10)+".json"; document.body.append(a); a.click(); a.remove();
};
$("impFile").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ const arr=JSON.parse(await f.text()); if(!Array.isArray(arr)) throw 0;
    for(const r of arr){ if(r&&r.id&&r.date&&r.machine) await localStore.save(r); }
    records=localStore.load(); usingSample=!records.length; render(); toast(arr.length+"件を読み込みました");
  }catch{ toast("読み込めませんでした。バックアップのファイルを選んでください"); }
  e.target.value="";
};
/* ---- storage: クラウド保存（db）→ 使えないときはこのブラウザ内 ---- */
const LS="pachinko-ledger-v1";
const localStore = {
  load(){ try{ return JSON.parse(localStorage.getItem(LS)||"[]"); }catch{ return []; } },
  async save(rec){ const a=this.load().filter(r=>r.id!==rec.id); a.push(rec); try{ localStorage.setItem(LS,JSON.stringify(a)); }catch{ throw new Error("ls"); } },
  async remove(id){ try{ localStorage.setItem(LS,JSON.stringify(this.load().filter(r=>r.id!==id))); }catch{ throw new Error("ls"); } }
};
function useLocal(msg){
  store=localStore; records=localStore.load(); usingSample=!records.length;
  $("status").textContent=msg; render();
}
useLocal("記録はこのスマホ（ブラウザ）内に保存されます。機種変更の前は「バックアップ」で保存しておいてください。");
</script>
